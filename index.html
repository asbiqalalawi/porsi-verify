<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7faf5"><meta name="referrer" content="no-referrer"><title>Verifikasi Email | Porsi</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:22px;background:#f7faf5;color:#1f382c;font-family:system-ui,-apple-system,sans-serif}
main{background:white;border:1px solid #e1eade;box-shadow:0 16px 45px #123d3210;border-radius:26px;padding:39px 29px;width:min(440px,100%);text-align:center}.brand{font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:28px}.brand b{color:#a6d75f}.symbol{display:grid;place-items:center;width:78px;height:78px;background:#e7f3dd;border-radius:50%;margin:0 auto 25px;font-size:40px;color:#15533f}h1{font-size:27px;line-height:1.25;letter-spacing:-.5px;margin:0 0 13px}p{font-size:15px;color:#648070;line-height:1.65;margin:0}.note{background:#f1f6ef;border-radius:14px;text-align:left;padding:17px;margin-top:26px;color:#476454;font-size:14px;line-height:1.6}.note strong{color:#1f382c}footer{margin-top:29px;font-size:12px;color:#92a99a}.app-link{display:block;background:#195341;color:white;text-decoration:none;padding:15px;border-radius:13px;font-size:15px;font-weight:700;margin-top:18px}[hidden]{display:none!important}
</style></head><body><main><div class="brand">porsi<b>.</b></div><div class="symbol" id="symbol" aria-hidden="true">✉</div><h1 id="title">Memeriksa verifikasi...</h1><p id="message">Tautan verifikasi sedang dibuka.</p><div class="note" id="note" hidden><strong>Langkah berikutnya</strong><div id="next"></div></div><a id="openApp" class="app-link" href="com.porsi.app://auth-callback" hidden>Buka aplikasi Porsi</a><footer>porsi. · your nutrition companion</footer></main>
<script>(function(){
const q=new URLSearchParams(location.search),f=new URLSearchParams(location.hash.replace(/^#/,""));
const error=f.get("error")||q.get("error")||f.get("error_code")||q.get("error_code");
const success=f.has("access_token")||f.has("refresh_token")||q.has("code");
history.replaceState(null,"",location.origin+location.pathname);
const t=document.getElementById("title"),m=document.getElementById("message"),n=document.getElementById("note"),c=document.getElementById("next"),s=document.getElementById("symbol");n.hidden=false;
if(error){s.textContent="!";s.style.background="#ffefe8";s.style.color="#b74c32";t.textContent="Link verifikasi tidak berlaku";m.textContent="Link verifikasi mungkin sudah kedaluwarsa atau pernah digunakan.";c.textContent="Buka Porsi di HP kamu untuk mencoba login. Jika akun belum aktif, minta email verifikasi baru.";}
else if(success){document.getElementById("openApp").hidden=false;s.textContent="✓";t.textContent="Email berhasil diverifikasi!";m.textContent="Akun Porsi kamu sudah aktif dan bisa digunakan untuk login.";c.textContent="Buka aplikasi Porsi di perangkat tempat kamu mendaftar, lalu login dengan email dan password. Walaupun email dibuka di perangkat lain, akunmu tetap terverifikasi.";}
else{t.textContent="Lanjutkan di aplikasi Porsi";m.textContent="Kalau kamu sudah menekan link verifikasi dari email, buka Porsi di HP kamu dan coba masuk.";c.textContent="Untuk keamanan, halaman ini hanya menampilkan status berhasil jika menerima hasil verifikasi dari Supabase.";}
})();</script></body></html>
